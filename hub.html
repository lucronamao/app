<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#8e2757">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Meus apps · Lucro na Mão</title>
<style>
:root{
  --vinho:#8e2757; --vinho-escuro:#6d1d43; --rose:#f6e7ee; --rose-2:#fdf4f8;
  --tinta:#2b2230; --cinza:#7a6f80; --linha:#eadfe6; --branco:#fff;
  --verde:#1e7d4f; --verde-bg:#e6f4ec; --ambar:#a05e03; --ambar-bg:#fdf2df;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--rose-2);color:var(--tinta);font-size:16px;min-height:100vh}
header{background:var(--vinho);color:#fff;padding:26px 16px 20px;text-align:center}
header h1{font-size:24px;font-weight:800}
header p{font-size:13.5px;opacity:.85;margin-top:3px}
main{padding:16px;max-width:560px;margin:0 auto}
.app-card{background:var(--branco);border:1px solid var(--linha);border-radius:16px;padding:16px;margin-bottom:14px;display:block;text-decoration:none;color:inherit}
.app-card .topo{display:flex;align-items:center;gap:12px}
.app-card .icone{width:46px;height:46px;border-radius:13px;background:var(--rose);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.app-card .icone svg{width:24px;height:24px;fill:none;stroke:var(--vinho);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app-card h2{font-size:17px;font-weight:800}
.app-card .desc{font-size:13.5px;color:var(--cinza);margin-top:2px;line-height:1.4}
.app-card .abrir{margin-top:12px;background:var(--vinho);color:#fff;text-align:center;border-radius:12px;padding:13px;font-weight:700}
.app-card.travado{border-style:dashed}
.app-card.travado .icone{background:var(--ambar-bg)}
.app-card.travado .icone svg{stroke:var(--ambar)}
.pitch{background:var(--rose-2);border-radius:12px;padding:11px 12px;font-size:13.5px;color:var(--tinta);margin-top:10px;line-height:1.5}
.preco-linha{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.preco-linha .p{font-size:20px;font-weight:800;color:var(--vinho)}
.preco-linha .p small{font-size:12px;color:var(--cinza);font-weight:600;display:block}
.preco-linha a{background:var(--ambar-bg);color:var(--ambar);padding:12px 18px;border-radius:12px;font-weight:800;text-decoration:none;font-size:14.5px}
.mini-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.mini-tags span{font-size:12px;font-weight:600;color:var(--vinho);background:var(--rose);border-radius:99px;padding:4px 10px}
.beneficios{margin-top:10px}
.beneficios div{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.45;padding:5px 0}
.beneficios svg{width:16px;height:16px;flex-shrink:0;margin-top:2px;fill:none;stroke:var(--verde);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.rodape{text-align:center;font-size:12.5px;color:var(--cinza);padding:10px 20px 30px;line-height:1.5}

.cfg-fundo{position:fixed;inset:0;background:rgba(43,34,48,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.cfg-fundo.aberto{display:flex}
.cfg-box{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:18px 16px 26px}
.cfg-box h3{font-size:17px;margin-bottom:2px}
.cfg-box .cfg-sub{font-size:13px;color:var(--cinza);margin-bottom:14px}
.cfg-box h4{font-size:12.5px;color:var(--cinza);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px}
.cfg-cores{display:flex;gap:12px}
.cfg-cores button{width:42px;height:42px;border-radius:50%;border:3px solid transparent;outline:2px solid var(--linha);cursor:pointer}
.cfg-cores button.on{border-color:var(--tinta)}
.cfg-btn{background:var(--vinho);color:#fff;width:100%;padding:14px;font-weight:700;border:0;border-radius:12px;font-size:15.5px;cursor:pointer;margin-top:8px;font-family:inherit}
.cfg-btn.sec{background:var(--rose);color:var(--vinho)}
.cfg-passos{font-size:14.5px;line-height:1.75;color:var(--cinza);padding-left:22px;margin:6px 0 2px}
.btn-cfg{background:none;border:0;color:#fff;display:flex;align-items:center;cursor:pointer;padding:4px}
.btn-cfg svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

<header style="position:relative">
  <div style="position:absolute;right:14px;top:16px"><button class="btn-cfg" onclick="Config.abrir()" aria-label="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1.03 1.56V21a2 2 0 11-4 0v-.09A1.7 1.7 0 008.94 19.3a1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.56-1.03H3a2 2 0 110-4h.09A1.7 1.7 0 004.7 8.94a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H9a1.7 1.7 0 001.03-1.56V3a2 2 0 114 0v.09a1.7 1.7 0 001.03 1.56 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.56 1.03H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.51 1.03z"/></svg></button></div>
  <img src="logo-branca.png" alt="Lucro na Mão" style="height:64px;width:auto;max-width:78%;margin:0 auto 2px;display:block">
  <p id="hdrSub">seus apps, pagos uma vez, seus pra sempre</p>
</header>

<main id="lista"></main>

<div class="rodape">Salve esta página na tela de início do celular:<br>menu do navegador (⋮) → "Adicionar à tela inicial".</div>

<script>
/* ===== desbloqueio por chave no link de entrega da Cakto =====
   ?libera=c        -> Controle da Lojinha (front)
   ?libera=cp       -> Controle + Precificação (front + bump)
   ?libera=tudo     -> tudo (front + bump + upsell futuro)
   A chave fica salva no aparelho: o link pode ser aberto uma vez só. */
const TEMAS={
  vinho:   {a:'#8e2757',b:'#6d1d43',c:'#f6e7ee',d:'#fdf4f8',nome:'Vinho'},
  violeta: {a:'#6b3fa0',b:'#532e80',c:'#efe8f7',d:'#f9f5fd',nome:'Violeta'},
  esmeralda:{a:'#1c7a5c',b:'#145c45',c:'#e4f2ec',d:'#f3faf7',nome:'Esmeralda'},
  petroleo:{a:'#22677a',b:'#194f5e',c:'#e3eff3',d:'#f2f8fa',nome:'Petróleo'},
  grafite: {a:'#3f3a45',b:'#2b2730',c:'#ece9ef',d:'#f7f5f9',nome:'Grafite'}
};
function aplicarTema(n){ const t=TEMAS[n]||TEMAS.vinho; const r=document.documentElement.style;
  r.setProperty('--vinho',t.a); r.setProperty('--vinho-escuro',t.b);
  r.setProperty('--rose',t.c); r.setProperty('--rose-2',t.d);
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content',t.a);
  localStorage.setItem('lucronamao_tema',n); }
aplicarTema(localStorage.getItem('lucronamao_tema')||'vinho');
const LK='lucronamao_liberado';
/* ===== LIBERACAO: QUEM MANDA E O LINK =====
   A chave do link SUBSTITUI o que estava salvo (nao soma).
   O localStorage guarda so a ultima chave usada, pra ela poder abrir o app pelo icone
   da tela inicial (que abre sem query string) e continuar com o mesmo acesso. */
const MAPA = {
  c:      ['controle'],
  d:      ['divulga'],
  p:      ['preco'],
  cd:     ['controle','divulga'],
  cp:     ['controle','preco'],          // compatibilidade
  u:      ['preco'],                     // compatibilidade
  tudo:   ['controle','divulga','preco']
};
(function(){
  const q = (new URLSearchParams(location.search).get('libera') || '').replace(/^so-/, '');
  if(!q) return;                                  // sem chave: usa a ultima salva
  if(q === 'zerar'){ localStorage.removeItem(LK); history.replaceState(null,'',location.pathname); return; }
  const libs = MAPA[q];
  if(!libs) return;                               // chave desconhecida: nao mexe
  localStorage.setItem(LK, libs.join(','));       // SUBSTITUI (o link e a verdade)
  history.replaceState(null,'',location.pathname);
})();
const tem = x => (localStorage.getItem(LK)||'').split(',').includes(x);

/* checkout dos degraus (preencher com os links da Cakto na montagem do funil) */
const CHECKOUT = { divulga:'#CHECKOUT_BUMP_CAKTO', preco:'#CHECKOUT_UPSELL_CAKTO' };

const ICO = {
  controle:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  preco:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1 1.1-1.7 2.5-1.7s2.5.7 2.5 1.7c0 2.6-5 1.6-5 4.4 0 1 1.1 1.7 2.5 1.7s2.5-.7 2.5-1.7"/></svg>',
  divulga:'<svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 01-9.3 8.4 8.6 8.6 0 01-3.9-1L3 20l1.2-4.6a8.4 8.4 0 1116.8-3.9z"/></svg>',
  cadeado:'<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>'
};

function card(app){
  if(app.liberado){
    const tags = app.tags ? `<div class="mini-tags">${app.tags.map(t=>`<span>${t}</span>`).join('')}</div>` : '';
    return `<a class="app-card" href="${app.url}">
      <div class="topo"><div class="icone">${app.icone}</div>
        <div><h2>${app.nome}</h2><div class="desc">${app.desc}</div></div></div>
      ${tags}
      <div class="abrir">Abrir</div></a>`;
  }
  const bens = app.beneficios ? `<div class="beneficios">${app.beneficios.map(b=>
    `<div><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg><span>${b}</span></div>`).join('')}</div>` : '';
  return `<div class="app-card travado">
    <div class="topo"><div class="icone">${ICO.cadeado}</div>
      <div><h2>${app.nome}</h2><div class="desc">${app.desc}</div></div></div>
    <div class="pitch">${app.pitch}</div>
    ${bens}
    <div class="preco-linha"><div class="p">${app.preco}<small>pagamento único</small></div>
      <a href="${app.checkout}">Liberar agora</a></div></div>`;
}

const APPS=[
  { id:'controle', nome:'Controle da Lojinha', icone:ICO.controle, url:'index.html',
    desc:'sua lojinha inteira organizada, direto do celular',
    tags:['registrar venda em 3 toques','lista de vendas','estoque automático','fiado anotado','resumo do mês com lucro'],
    liberado:tem('controle'), preco:'R$ 47', checkout:'#',
    pitch:'Vendas, estoque com baixa automática, fiado, despesas e o resumo do mês. Sem planilha, sem mensalidade.' },
  { id:'divulga', nome:'Divulga na Mão', icone:ICO.divulga, url:'divulga.html',
    desc:'mensagens e artes prontas pra vender mais',
    tags:['12 mensagens prontas','arte pro status com sua logo','cobrar com jeitinho','enviar direto no WhatsApp'],
    liberado:tem('divulga'), preco:'R$ 27', checkout:CHECKOUT.divulga,
    pitch:'Vender mais não é mandar qualquer mensagem. É mandar a mensagem certa, na hora certa:',
    beneficios:['12 situações prontas: chegou novidade, oferta do dia, cliente sumida, cobrar fiado com jeitinho e mais',
      'gera a ARTE pro status com a sua logo, seu @ e a cor do seu tema, em 10 segundos',
      'preenche 2 campos e envia direto no WhatsApp ou cola no status'] },
  { id:'preco', nome:'Precificação na Mão', icone:ICO.preco, url:'precificacao.html',
    desc:'pra nunca mais vender no prejuízo sem perceber',
    tags:['custo + frete + taxa','margem que você quer','testar qualquer preço'],
    liberado:tem('preco'), preco:'R$ 97', checkout:CHECKOUT.preco,
    pitch:'Tem peça que você vende e, no fim, não sobra quase nada. Esse app faz a conta que evita isso:',
    beneficios:['você digita o que pagou na peça e ele te diz o preço certo de venda, com frete e taxa da maquininha já dentro',
      'escolhe quanto quer ganhar e vê na hora quanto sobra por peça',
      'testa qualquer preço antes de anunciar e descobre se vale a pena'] }
];

document.getElementById('lista').innerHTML = APPS.map(card).join('');
if(!tem('controle') && !tem('preco') && !tem('divulga'))
  document.getElementById('lista').innerHTML =
    `<div class="app-card"><div class="pitch">Este é o espaço da compradora do Lucro na Mão.
     Se você comprou, use o link de acesso que chegou no seu e-mail. Qualquer coisa, fala com a gente no suporte.</div></div>`
    + document.getElementById('lista').innerHTML;




/* ============ AJUSTES (engrenagem): cor + instalar ============ */
const Config = {
  abrir(){ this.pintar(); document.getElementById('cfgFundo').classList.add('aberto'); },
  fechar(){ document.getElementById('cfgFundo').classList.remove('aberto'); },
  pintar(){
    const atual = localStorage.getItem('lucronamao_tema')||'vinho';
    document.getElementById('cfgCores').innerHTML = Object.keys(TEMAS).map(k=>
      `<button class="${k===atual?'on':''}" style="background:${TEMAS[k].a}" aria-label="${TEMAS[k].nome}"
        onclick="aplicarTema('${k}');Config.pintar();if(typeof Tela!=='undefined'&&Tela.render)Tela.render();"></button>`).join('');
    const inst = Instalar.instalado();
    document.getElementById('cfgInstalarBloco').style.display = inst ? 'none' : '';
  },
  instalar(){ Instalar.instalar(); },
  mostrarPassos(passos){
    document.getElementById('cfgPassos').innerHTML =
      `<ol class="cfg-passos">${passos.map(p=>`<li>${p}</li>`).join('')}</ol>`;
  }
};

/* ============ INSTALACAO (PWA) ============ */
const Instalar = {
  prompt:null,
  init(){
    // registra o cache offline SO quando o app ja esta instalado na tela inicial.
    // (no navegador comum a pagina sempre vem da rede, sem versao velha em cache)
    if('serviceWorker' in navigator){
      if(this.instalado()) navigator.serviceWorker.register('sw.js').catch(()=>{});
      else navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
    }
    window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); this.prompt=e; });
    window.addEventListener('appinstalled', ()=>{ this.prompt=null;
      if(typeof Config!=='undefined') Config.pintar(); });
  },
  instalado(){ return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true; },
  iOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); },
  async instalar(){
    if(this.prompt){ this.prompt.prompt(); const r=await this.prompt.userChoice;
      if(r.outcome==='accepted'){ this.prompt=null; if(typeof Config!=='undefined') Config.pintar(); }
      return; }
    const passos = this.iOS()
      ? ['Toque no botao de <b>compartilhar</b> (quadrado com a seta pra cima)',
         'Role a lista e toque em <b>Adicionar a Tela de Inicio</b>',
         'Confirme em <b>Adicionar</b>']
      : ['Toque nos <b>tres pontinhos</b> no canto de cima do navegador',
         'Toque em <b>Adicionar a tela inicial</b> (ou Instalar aplicativo)',
         'Confirme em <b>Instalar</b>'];
    if(typeof Config!=='undefined') Config.mostrarPassos(passos);
  }
};
Instalar.init();

</script>

<div class="cfg-fundo" id="cfgFundo" onclick="if(event.target===this)Config.fechar()">
  <div class="cfg-box">
    <h3>Ajustes</h3>
    <div class="cfg-sub">Deixe o app com a sua cara.</div>
    <h4>cor do aplicativo</h4>
    <div class="cfg-cores" id="cfgCores"></div>
    <div id="cfgInstalarBloco">
      <h4>aplicativo no celular</h4>
      <p style="font-size:14px;line-height:1.5;color:var(--cinza)">Ícone próprio na tela, abre sem navegador e funciona sem internet.</p>
      <button class="cfg-btn" onclick="Config.instalar()">Adicionar à tela inicial</button>
      <div id="cfgPassos"></div>
    </div>
    <button class="cfg-btn sec" onclick="Config.fechar()">Fechar</button>
  </div>
</div>

</body>
</html>
